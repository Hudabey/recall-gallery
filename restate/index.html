<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReCall — stream gallery</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #14181d; --panel2: #1a1f26; --text: #e8eaed;
    --dim: #9aa4af; --accent: #4cc38a; --accent2: #6a9ff5; --warn: #e5a54b;
    --danger: #e0645c; --border: #242b33;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 28px 32px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .3px; }
  header .sub { color: var(--dim); font-size: 13px; }
  #filters { padding: 14px 32px; display: flex; gap: 8px; flex-wrap: wrap; }
  #filters button {
    background: var(--panel); color: var(--dim); border: 1px solid var(--border);
    border-radius: 999px; padding: 5px 14px; font-size: 13px; cursor: pointer;
  }
  #filters button.on { color: var(--text); border-color: var(--accent); }
  #grid {
    display: grid; gap: 20px; padding: 8px 32px 48px;
    grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
  }
  .card video { width: 100%; aspect-ratio: 832/480; background: #000; display: block; }
  .card .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
  .card h2 { margin: 0; font-size: 14.5px; font-weight: 600; line-height: 1.35; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    font-size: 11.5px; padding: 2px 9px; border-radius: 999px;
    background: var(--panel2); border: 1px solid var(--border); color: var(--dim);
  }
  .badge.arm-ON { color: var(--accent); border-color: var(--accent); }
  .badge.arm-OFF { color: var(--dim); }
  .badge.arm-SCRAMBLE { color: var(--warn); border-color: var(--warn); }
  .badge.arm-RAW { color: var(--accent2); border-color: var(--accent2); }
  .badge.placeholder { color: var(--danger); border-color: var(--danger); }
  details { font-size: 12.5px; color: var(--dim); }
  details summary { cursor: pointer; user-select: none; }
  .sched { margin: 6px 0 0; padding: 0; list-style: none; }
  .sched li { padding: 2px 0; border-top: 1px dashed var(--border); }
  .sched .t { color: var(--accent2); font-variant-numeric: tabular-nums; margin-right: 8px; }
  .metrics { font-size: 12px; color: var(--dim); display: flex; gap: 14px; flex-wrap: wrap; }
  .metrics b { color: var(--text); font-weight: 600; }
  #empty { padding: 60px 32px; color: var(--dim); text-align: center; }
  footer { padding: 18px 32px 40px; color: var(--dim); font-size: 12px; border-top: 1px solid var(--border); }
  a { color: var(--accent2); }
</style>
</head>
<body>
<header>
  <h1>ReCall — stream gallery</h1>
  <div class="sub" id="meta">loading…</div>
</header>
<div id="filters"></div>
<div id="grid"></div>
<div id="empty" hidden>No entries match.</div>
<footer>
  Closed-loop character consistency in long autoregressive streaming video.
  Cards are emitted by the ReCall posting pipeline; media and index are
  served from object storage (<code>videos.json</code> is the source of truth).
</footer>
<script>
(async () => {
  const cfg = await fetch("config.json").then(r => r.json()).catch(() => ({}));
  const base = (cfg.media_base || ".").replace(/\/$/, "");
  const meta = document.getElementById("meta");
  let data;
  try {
    data = await fetch(`${base}/videos.json`, {cache: "no-store"}).then(r => r.json());
  } catch (e) {
    meta.textContent = `failed to load ${base}/videos.json — ${e}`;
    return;
  }
  const vids = (data.videos || []).slice();   // manifest is already newest first
  meta.textContent =
    `${vids.length} entr${vids.length === 1 ? "y" : "ies"} · updated ${data.generated_at || "?"}`;

  const arms = [...new Set(vids.map(v => (v.metrics || {}).arm).filter(Boolean))];
  const filters = document.getElementById("filters");
  let active = null;
  const mkBtn = (label, val) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.onclick = () => { active = val; render();
      [...filters.children].forEach(c => c.classList.toggle("on", c === b)); };
    filters.appendChild(b);
    return b;
  };
  mkBtn("all", null).classList.add("on");
  arms.forEach(a => mkBtn(a, a));

  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const esc = s => String(s ?? "").replace(/[&<>"]/g,
    c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

  function render() {
    grid.innerHTML = "";
    const shown = vids.filter(v => !active || (v.metrics || {}).arm === active);
    empty.hidden = shown.length > 0;
    for (const v of shown) {
      const m = v.metrics || {};
      const card = document.createElement("div");
      card.className = "card";
      const badges = [
        m.arm ? `<span class="badge arm-${esc(m.arm)}">${esc(m.arm)}</span>` : "",
        m.stage === "placeholder" ? `<span class="badge placeholder">PLACEHOLDER</span>` : "",
        m.seed !== undefined ? `<span class="badge">seed ${esc(m.seed)}</span>` : "",
        v.duration_s ? `<span class="badge">${Number(v.duration_s).toFixed(1)} s</span>` : "",
        m.resolution ? `<span class="badge">${esc(m.resolution)}</span>` : "",
        m.script ? `<span class="badge">${esc(m.script)}</span>` : "",
      ].join("");
      const sched = (v.schedule || []).map(s =>
        `<li><span class="t">${Number(s.start_s).toFixed(1)}–${Number(s.end_s).toFixed(1)}s</span>${esc(s.prompt)}</li>`).join("");
      const extras = Object.entries(m)
        .filter(([k]) => !["arm", "seed", "resolution", "script", "stage"].includes(k))
        .map(([k, val]) => `<span>${esc(k)}: <b>${esc(
          typeof val === "object" ? JSON.stringify(val) : val)}</b></span>`).join("");
      card.innerHTML = `
        <video controls preload="metadata" src="${/^https?:/.test(v.src) ? esc(v.src) : `${base}/${esc(v.src)}`}"></video>
        <div class="body">
          <h2>${esc(v.model || v.id)}</h2>
          <div class="badges">${badges}</div>
          ${sched ? `<details><summary>prompt schedule (${(v.schedule || []).length})</summary><ul class="sched">${sched}</ul></details>` : ""}
          ${extras ? `<div class="metrics">${extras}</div>` : ""}
        </div>`;
      grid.appendChild(card);
    }
  }
  render();
})();
</script>
</body>
</html>
